<title>말풍선 브레인스토밍</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600&display=swap">
<style>
/* SUIT SemiBold (c) SUNN, SIL Open Font License 1.1 — same face as the reference app's 'SUIT-600'. */
@font-face{font-family:'SUIT-600';font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__SUIT_WOFF2__) format('woff2')}
</style>
<style>
/* Layout: one centered column like the reference app — nav, a "주제:" line, a 20px-radius card, and the 70px pill input under it.
   The card holds two screens: floating bubbles, then 기능 / 디자인 boxes to drag them into. */
:root {
  --bg: #FFFFFF;
  --card: #FFFFFF;
  --fg: #000000;
  --muted: #8E8E93;
  --blue: #1973DD;
  --on-blue: #FFFFFF;
  --gray: #DDDDDD;
  --on-gray: #000000;
  --danger: #FF3B30;
  --line: rgba(100, 100, 100, 0.15);
  --line-strong: rgba(100, 100, 100, 0.3);
  --wash: rgba(100, 100, 100, 0.07);
  --bin-bg: #F6F7F9;
  --shadow: rgba(100, 100, 100, 0.05);
  --lift: rgba(30, 40, 60, 0.18);
  --focus: rgba(25, 115, 221, 0.45);
  --faded-ink: #0B4A92;
  /* Korean faces only, so Latin always comes from the same face as Hangul; a Latin system font here
     (-apple-system) would set English in SF while Korean fell back to Apple SD Gothic Neo. */
  --font: 'SUIT-600', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --msg: 22px;
  --tile-scale: 0.8;
  --pill-h: 70px;
  --send: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #0E0E10;
    --fg: #FFFFFF;
    --muted: #8E8E93;
    --blue: #1973DD;
    --on-blue: #FFFFFF;
    --gray: #2C2C2E;
    --on-gray: #FFFFFF;
    --danger: #FF453A;
    --line: rgba(160, 160, 170, 0.18);
    --line-strong: rgba(160, 160, 170, 0.34);
    --wash: rgba(255, 255, 255, 0.07);
    --bin-bg: #16171A;
    --shadow: rgba(0, 0, 0, 0.5);
    --lift: rgba(0, 0, 0, 0.55);
    --focus: rgba(77, 152, 240, 0.55);
    --faded-ink: rgba(255, 255, 255, 0.82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #0E0E10;
  --fg: #FFFFFF;
  --muted: #8E8E93;
  --blue: #1973DD;
  --on-blue: #FFFFFF;
  --gray: #2C2C2E;
  --on-gray: #FFFFFF;
  --danger: #FF453A;
  --line: rgba(160, 160, 170, 0.18);
  --line-strong: rgba(160, 160, 170, 0.34);
  --wash: rgba(255, 255, 255, 0.07);
  --bin-bg: #16171A;
  --shadow: rgba(0, 0, 0, 0.5);
  --lift: rgba(0, 0, 0, 0.55);
  --focus: rgba(77, 152, 240, 0.55);
  --faded-ink: rgba(255, 255, 255, 0.82);
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  width: min(100%, max(65vw, 640px));
  height: 100%;
  min-height: 540px;
  margin: 0 auto;
  padding-block: clamp(12px, 4vh, 48px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- nav ---------- */
.nav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 40px; }
.nav-side { display: flex; min-width: 0; }
.nav-side.end { justify-content: flex-end; }
.nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; text-align: center; }
.text-btn {
  border: 0; background: none; color: var(--blue); font-size: 17px; padding: 8px 2px;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.text-btn[data-armed] { color: var(--danger); }
.pill-btn {
  border: 0; background: var(--blue); color: var(--on-blue); border-radius: 999px;
  padding: 9px 18px; font-size: 16px; cursor: pointer; white-space: nowrap; transition: opacity .15s, transform .15s;
}
.pill-btn:disabled { opacity: .35; cursor: default; }
.pill-btn:not(:disabled):active { transform: scale(.96); }

/* ---------- "주제:" line, like the 받는 사람: field of a new message ---------- */
.to-line { display: flex; align-items: center; gap: 8px; padding: 0 6px 12px; border-bottom: 1px solid var(--line); }
.to-line label { flex: none; font-size: 17px; color: var(--muted); }
.to-line input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px; letter-spacing: -0.3px; color: var(--fg); }
.to-line input::placeholder, .pill input::placeholder { color: var(--muted); opacity: .7; }

/* ---------- card + its two screens ---------- */
.card {
  position: relative; flex: 1; min-height: 240px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--card);
  box-shadow: var(--shadow) 0px 15px 30px; overflow: hidden;
}
.view { position: absolute; inset: 0; background: var(--card); }
.stage { overflow: hidden; }
.stage-empty { position: absolute; left: 24px; right: 24px; top: 46%; text-align: center; font-size: 17px; color: var(--muted); pointer-events: none; }

/* ---------- bubbles (reference: -0.5px tracking, 0.8em padding, 30px radius) ---------- */
.bubble {
  display: block; width: max-content; max-width: 100%; border-radius: 30px; padding: 0.8em;
  font-size: var(--msg); line-height: 1.3; letter-spacing: -0.5px; overflow-wrap: anywhere; text-align: left;
  transition: background-color .6s, color .6s, box-shadow .2s;
}
.float, .tile {
  border: 0; background: none; padding: 0; border-radius: 30px; cursor: grab; text-align: left;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.float { position: absolute; left: 0; top: 0; z-index: 1; max-width: min(80%, 20em); font-size: calc(var(--msg) * var(--float-scale, 1)); will-change: transform; }
.tile { display: block; max-width: 100%; font-size: calc(var(--msg) * var(--tile-scale)); }
.float .bubble, .tile .bubble { width: auto; font-size: inherit; background: color-mix(in srgb, var(--blue) var(--fresh, 100%), var(--card)); color: var(--on-blue); }
.float.is-faded:not(.is-off) .bubble, .tile.is-faded:not(.is-off) .bubble { color: var(--faded-ink); }
.float.is-off .bubble, .tile.is-off .bubble { background: var(--gray); color: var(--on-gray); opacity: .55; text-decoration: line-through; }
.float.is-held { z-index: 3; cursor: grabbing; }
.float.is-held .bubble { transform: scale(1.04); }
.float.is-held .bubble, .is-selected .bubble { box-shadow: 0 12px 28px var(--lift); }
.float.is-selected { z-index: 3; }
.is-new .bubble { animation: pop .42s cubic-bezier(.2, .9, .3, 1.25) backwards; }
.is-leaving { pointer-events: none; }
.is-leaving .bubble { animation: popout .24s ease-in forwards; }
.tile.is-dragging { opacity: .25; }
.ghost { position: fixed; left: 0; top: 0; z-index: 50; margin: 0; pointer-events: none; }
.ghost .bubble { box-shadow: 0 16px 34px var(--lift); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popout { to { transform: scale(.3); opacity: 0; } }

/* tapback: the little menu that opens over a pressed bubble */
.tapback {
  position: absolute; left: 0; top: 0; z-index: 6; display: flex; gap: 2px; padding: 5px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 10px 30px var(--lift);
}
.tapback button { border: 0; background: none; border-radius: 999px; padding: 8px 14px; font-size: 15px; color: var(--fg); cursor: pointer; white-space: nowrap; }
.tapback button:hover { background: var(--wash); }
.tapback .danger { color: var(--danger); }

/* ---------- sort screen: waiting bubbles on top, 기능 and 디자인 boxes below ---------- */
.sort { display: flex; flex-direction: column; gap: 18px; padding: 24px 20px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.sort::-webkit-scrollbar { display: none; }
.tray { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; padding: 6px; margin: -6px; border-radius: 20px; transition: background-color .15s; }
.tray.is-over { background: var(--wash); }
.bins { flex: 1 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bin {
  display: flex; flex-direction: column; gap: 12px; min-height: 220px; padding: 14px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--bin-bg); transition: border-color .15s, box-shadow .15s;
}
.bin.is-over { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.bin-name { display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.bin-count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bin-items { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }

/* ---------- dock: the reference's 70px input pill and round send button ---------- */
.dock { flex: none; padding-top: 14px; }
.pill {
  height: var(--pill-h); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 10px;
  border: 1px solid var(--line-strong); border-radius: 30px; background: var(--bg); transition: border-color .15s;
}
.pill:focus-within { border-color: var(--focus); }
.pill input { flex: 1; min-width: 0; height: 100%; margin-left: 10px; border: 0; background: transparent; outline: none; font-size: 25px; letter-spacing: -0.5px; color: var(--fg); }
.send { flex: none; width: var(--send); height: var(--send); padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; transition: opacity .15s, transform .15s; }
.send svg { display: block; width: 100%; height: 100%; }
.send circle { fill: var(--blue); }
.send path { stroke: var(--on-blue); }
.send:disabled { opacity: .3; cursor: default; }
.send:not(:disabled):active { transform: scale(.92); }

@media (max-width: 720px) {
  :root { --msg: 17px; --tile-scale: 0.9; --pill-h: 56px; --send: 40px; }
  .app { gap: 12px; padding-block: 10px 12px; }
  .nav-title { font-size: 16px; }
  .bubble { border-radius: 24px; }
  .sort { padding: 16px 12px; gap: 14px; }
  .bins { grid-template-columns: 1fr; }
  .bin { min-height: 150px; }
  .pill { gap: 10px; padding: 7px; }
  .pill input { margin-left: 8px; font-size: 18px; }
  .dock { padding-top: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="app">
  <header class="nav">
    <div class="nav-side"><button class="text-btn" id="navLeft" type="button"></button></div>
    <h1 class="nav-title" id="navTitle">브레인스토밍</h1>
    <div class="nav-side end"><button class="pill-btn" id="navRight" type="button"></button></div>
  </header>

  <div class="to-line">
    <label for="topic">주제:</label>
    <input id="topic" type="text" maxlength="80" autocomplete="off" placeholder="무엇에 대한 브레인스토밍인가요?">
  </div>

  <main class="card" id="card">
    <section class="view stage" id="stage" aria-label="아이디어 말풍선">
      <p class="stage-empty" id="stageEmpty" hidden>아래 입력창에 첫 아이디어를 적어 보세요</p>
    </section>
    <section class="view sort" id="sort" aria-label="기능과 디자인으로 나누기" hidden>
      <div class="tray" id="tray" data-drop=""></div>
      <div class="bins">
        <div class="bin" data-drop="function">
          <h2 class="bin-name">기능<span class="bin-count" id="count-function"></span></h2>
          <div class="bin-items" id="items-function"></div>
        </div>
        <div class="bin" data-drop="design">
          <h2 class="bin-name">디자인<span class="bin-count" id="count-design"></span></h2>
          <div class="bin-items" id="items-design"></div>
        </div>
      </div>
    </section>
    <div class="tapback" id="tapback" role="menu" hidden></div>
  </main>

  <footer class="dock">
    <div class="pill">
      <input id="ideaInput" type="text" maxlength="200" autocomplete="off" enterkeyhint="send" placeholder="아이디어 입력" aria-label="아이디어 입력">
      <button class="send" id="sendBtn" type="button" aria-label="보내기" disabled>
        <svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="25"/><path d="M25 35.8854V14.0104" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.8854 23.125L25 14.0104L34.1146 23.125" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>
  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'bubble-brainstorm:v2';
  const OLD_STORE_KEY = 'bubble-brainstorm:v1';
  const BINS = [{ id: 'function', name: '기능' }, { id: 'design', name: '디자인' }];
  const BIN_IDS = BINS.map(b => b.id);
  const DRIFT = 16; // px/s, resting float speed

  const $ = id => document.getElementById(id);
  const els = {
    navLeft: $('navLeft'), navRight: $('navRight'), navTitle: $('navTitle'), topic: $('topic'), card: $('card'),
    stage: $('stage'), stageEmpty: $('stageEmpty'), sort: $('sort'), tray: $('tray'), tapback: $('tapback'),
    ideaInput: $('ideaInput'), sendBtn: $('sendBtn'), live: $('live'),
  };
  const binEls = Object.fromEntries(BINS.map(b => [b.id, { items: $('items-' + b.id), count: $('count-' + b.id) }]));
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  const calm = () => motionQuery.matches;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // Keys left by the removed AI classification; nothing reads them any more.
  for (const key of ['bubble-brainstorm:gemini-key', 'bubble-brainstorm:anthropic-key']) {
    try { localStorage.removeItem(key); } catch (_) { /* no storage */ }
  }

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  function announce(msg) {
    els.live.textContent = '';
    requestAnimationFrame(() => { els.live.textContent = msg; });
  }

  // ---------- state ----------
  // view: 'collect' (bubbles float) or 'sort' (drag them into 기능 / 디자인)
  // idea.cat: 'function' | 'design' | null; idea.keep: false greys it out (빼기)
  const blank = () => ({ topic: '', ideas: [], view: 'collect', nextId: 1 });
  let state = blank();

  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) { return null; }
  }

  function load() {
    let saved = readJSON(STORE_KEY);
    if (!saved) {
      const old = readJSON(OLD_STORE_KEY);
      if (old && Array.isArray(old.ideas) && !old.example) saved = { topic: old.topic || '', ideas: old.ideas, nextId: old.nextId };
    }
    // Earlier builds opened with example ideas; a board that was still the example starts empty.
    if (!saved || saved.example || !Array.isArray(saved.ideas)) return;
    state.topic = typeof saved.topic === 'string' ? saved.topic : '';
    state.ideas = saved.ideas
      .filter(i => i && typeof i.text === 'string' && Number.isFinite(i.id))
      .map(i => ({ id: i.id, text: i.text, keep: i.keep !== false, cat: BIN_IDS.includes(i.cat) ? i.cat : null }));
    state.nextId = Math.max(Number(saved.nextId) || 1, 1, ...state.ideas.map(i => i.id + 1));
    state.view = saved.view === 'sort' && state.ideas.length ? 'sort' : 'collect';
  }

  let saveTimer = 0;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) { /* no storage: this visit only */ }
    }, 200);
  }

  const findIdea = id => state.ideas.find(i => i.id === id);
  const ideaMap = () => new Map(state.ideas.map(i => [i.id, i]));

  // ---------- screens ----------
  // 분류하기 pushes the sort screen in from the right, like a phone's next screen; ‹ 모으기 slides back.
  function showView(next) {
    if (state.view === next) return;
    closeTapback();
    state.view = next;
    const inEl = next === 'sort' ? els.sort : els.stage;
    const outEl = next === 'sort' ? els.stage : els.sort;
    inEl.hidden = false;
    if (next === 'sort') { els.sort.scrollTop = 0; renderSort(); } else { refreshBounds(); syncBodies(); }
    if (calm()) {
      outEl.hidden = true;
    } else {
      const dir = next === 'sort' ? 1 : -1;
      const timing = { duration: 380, easing: 'cubic-bezier(.2, .8, .2, 1)' };
      const out = outEl.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${-dir * 30}%)`, opacity: 0 }], { ...timing, fill: 'forwards' });
      inEl.animate([{ transform: `translateX(${dir * 100}%)` }, { transform: 'translateX(0)' }], timing);
      out.finished.then(() => { if (state.view === next) outEl.hidden = true; out.cancel(); }, () => {});
    }
    renderChrome();
    save();
  }

  function renderChrome() {
    const n = state.ideas.length;
    if (state.view === 'collect') {
      els.navTitle.textContent = '브레인스토밍';
      setBtn(els.navLeft, n || state.topic.trim() ? 'reset' : '', '새로 시작');
      setBtn(els.navRight, 'sort', '분류하기', { primary: true, disabled: n === 0 });
    } else {
      els.navTitle.textContent = '분류하기';
      setBtn(els.navLeft, 'back', '‹ 모으기');
      setBtn(els.navRight, '', '');
    }
    els.stageEmpty.hidden = n > 0;
    els.sendBtn.disabled = !els.ideaInput.value.trim();
  }

  function setBtn(btn, act, label, { disabled = false, primary = false } = {}) {
    btn.dataset.act = act;
    btn.textContent = label;
    btn.hidden = !act;
    btn.disabled = disabled;
    btn.removeAttribute('data-armed');
    if (btn === els.navRight) btn.className = primary ? 'pill-btn' : 'text-btn';
  }

  // Two taps to wipe real work; the viewer frame blocks confirm().
  function confirmTap(btn, run) {
    if (btn.hasAttribute('data-armed')) { btn.removeAttribute('data-armed'); run(); return; }
    const label = btn.textContent;
    btn.setAttribute('data-armed', '');
    btn.textContent = '한 번 더 눌러서 지우기';
    setTimeout(() => {
      if (btn.hasAttribute('data-armed')) { btn.removeAttribute('data-armed'); btn.textContent = label; }
    }, 2600);
  }

  function onNav(e) {
    const btn = e.currentTarget;
    switch (btn.dataset.act) {
      case 'sort': showView('sort'); break;
      case 'back': showView('collect'); break;
      case 'reset': confirmTap(btn, resetAll); break;
    }
  }

  function resetAll() {
    popAllBodies();
    state = blank();
    els.topic.value = '';
    els.ideaInput.value = '';
    renderSort();
    renderChrome();
    save();
    els.ideaInput.focus();
    announce('새 브레인스토밍을 시작했어요.');
  }

  // ---------- collect screen: floating bubbles ----------
  const bodies = new Map();
  let stageBounds = { l: 0, r: 0, t: 0, b: 0 };
  let floatScale = 1;
  let lastT = 0;

  function refreshBounds() {
    const W = els.stage.clientWidth, H = els.stage.clientHeight;
    const pad = W < 520 ? 12 : 20;
    stageBounds = { l: pad, r: Math.max(pad, W - pad), t: pad, b: Math.max(pad + 60, H - pad) };
  }

  function syncBodies(spawnId) {
    const byId = ideaMap();
    for (const [id, p] of bodies) if (!byId.has(id)) { p.el.remove(); bodies.delete(id); }
    for (const idea of state.ideas) if (!bodies.has(idea.id)) createBody(idea);
    paintKeep();
    applyAges();
    fitScale();
    for (const p of bodies.values()) {
      if (!p.unplaced) continue;
      p.unplaced = false;
      if (p.id === spawnId && !calm()) spawnAt(p); else placeFree(p);
    }
  }

  function createBody(idea) {
    const el = h('button', { type: 'button', class: 'float', 'data-id': idea.id, 'aria-label': `${idea.text}. 눌러서 고치거나 빼기` },
      h('span', { class: 'bubble' }, idea.text));
    els.stage.append(el);
    const p = { id: idea.id, el, x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, phase: Math.random() * Math.PI * 2, held: false, unplaced: true };
    bodies.set(idea.id, p);
    bindFloat(p);
    return p;
  }

  function paintKeep() {
    const byId = ideaMap();
    for (const p of bodies.values()) { const idea = byId.get(p.id); if (idea) p.el.classList.toggle('is-off', !idea.keep); }
  }

  // Older ideas fade toward the card color: each later idea takes 5.5% off, down to 35%.
  function applyAges() {
    const n = state.ideas.length;
    state.ideas.forEach((idea, i) => {
      const fresh = Math.max(0.35, 1 - (n - 1 - i) * 0.055);
      const p = bodies.get(idea.id);
      const tile = els.sort.querySelector(`.tile[data-id="${idea.id}"]`);
      for (const el of [p && p.el, tile]) {
        if (!el) continue;
        el.style.setProperty('--fresh', `${Math.round(fresh * 100)}%`);
        el.classList.toggle('is-faded', fresh < 0.75);
      }
    });
  }

  function measureAll() {
    for (const p of bodies.values()) { p.w = p.el.offsetWidth; p.h = p.el.offsetHeight; }
  }

  // Shrink the floating bubbles as the card fills up, grow them back when there is room.
  function fitScale() {
    measureAll();
    const b = stageBounds;
    const room = Math.max(1, (b.r - b.l) * (b.b - b.t));
    for (let i = 0; i < 10; i++) {
      let area = 0;
      for (const p of bodies.values()) area += (p.w + 14) * (p.h + 14);
      let next = floatScale;
      if (area > room * 0.47 && floatScale > 0.5) next = Math.max(0.5, floatScale - 0.07);
      else if (area < room * 0.2 && floatScale < 1) next = Math.min(1, floatScale + 0.07);
      if (next === floatScale) break;
      floatScale = next;
      els.stage.style.setProperty('--float-scale', floatScale.toFixed(2));
      measureAll();
    }
  }

  // A new bubble rises from the input at the bottom of the card.
  function spawnAt(p) {
    const b = stageBounds;
    p.x = (b.l + b.r) / 2 - p.w / 2 + (Math.random() - 0.5) * 60;
    p.y = b.b - p.h;
    p.vx = (Math.random() - 0.5) * 60;
    p.vy = -(240 + Math.random() * 80);
    markNew(p.el);
    clampToBounds(p);
  }

  function markNew(el) {
    el.classList.add('is-new');
    el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });
  }

  function placeFree(p) {
    const b = stageBounds;
    let best = { x: b.l, y: b.t }, bestScore = Infinity;
    for (let k = 0; k < 40 && bestScore > 0; k++) {
      const x = b.l + Math.random() * Math.max(0, b.r - b.l - p.w);
      const y = b.t + Math.random() * Math.max(0, b.b - b.t - p.h);
      let score = 0;
      for (const q of bodies.values()) {
        if (q === p || q.unplaced) continue;
        const ox = Math.min(x + p.w, q.x + q.w) - Math.max(x, q.x) + 12;
        const oy = Math.min(y + p.h, q.y + q.h) - Math.max(y, q.y) + 12;
        if (ox > 0 && oy > 0) score += ox * oy;
      }
      if (score < bestScore) { bestScore = score; best = { x, y }; }
    }
    p.x = best.x; p.y = best.y;
    const a = Math.random() * Math.PI * 2;
    p.vx = Math.cos(a) * DRIFT * 0.7; p.vy = Math.sin(a) * DRIFT * 0.7;
  }

  function clampToBounds(p, bounce = false) {
    const b = stageBounds;
    const maxX = Math.max(b.l, b.r - p.w), maxY = Math.max(b.t, b.b - p.h);
    if (p.x < b.l) { p.x = b.l; if (bounce) p.vx = Math.abs(p.vx); }
    else if (p.x > maxX) { p.x = maxX; if (bounce) p.vx = -Math.abs(p.vx); }
    if (p.y < b.t) { p.y = b.t; if (bounce) p.vy = Math.abs(p.vy); }
    else if (p.y > maxY) { p.y = maxY; if (bounce) p.vy = -Math.abs(p.vy); }
  }

  function tick(t) {
    const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    if (!els.stage.hidden) {
      step(dt);
      renderBodies(t);
    }
    requestAnimationFrame(tick);
  }

  function step(dt) {
    const list = [...bodies.values()];
    const moving = !calm();
    for (const p of list) {
      if (p.held) continue;
      if (!moving) { p.vx = 0; p.vy = 0; continue; }
      p.vx += (Math.random() - 0.5) * 30 * dt;
      p.vy += (Math.random() - 0.5) * 30 * dt;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > DRIFT) {
        const k = Math.max(DRIFT / sp, 1 - 1.4 * dt);
        p.vx *= k; p.vy *= k;
      } else if (sp < DRIFT * 0.4) {
        const a = Math.random() * Math.PI * 2;
        p.vx += Math.cos(a) * 3; p.vy += Math.sin(a) * 3;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    separate(list, dt, 12);
    for (const p of list) if (!p.held) clampToBounds(p, true);
  }

  // Push overlapping bubbles apart along the axis of least overlap.
  function separate(list, dt, gap) {
    const maxPush = Math.max(2, 260 * dt);
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      for (let j = i + 1; j < list.length; j++) {
        const c = list[j];
        const dx = (c.x + c.w / 2) - (a.x + a.w / 2);
        const dy = (c.y + c.h / 2) - (a.y + a.h / 2);
        const ox = (a.w + c.w) / 2 + gap - Math.abs(dx);
        const oy = (a.h + c.h) / 2 + gap - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        const wa = a.held ? 0 : c.held ? 1 : 0.5;
        const wc = c.held ? 0 : a.held ? 1 : 0.5;
        if (ox < oy) {
          const s = Math.sign(dx) || 1, push = Math.min(ox, maxPush);
          a.x -= s * push * wa; c.x += s * push * wc;
          a.vx -= s * 6 * wa; c.vx += s * 6 * wc;
        } else {
          const s = Math.sign(dy) || 1, push = Math.min(oy, maxPush);
          a.y -= s * push * wa; c.y += s * push * wc;
          a.vy -= s * 6 * wa; c.vy += s * 6 * wc;
        }
      }
    }
  }

  function renderBodies(t) {
    const amp = calm() ? 0 : 3;
    for (const p of bodies.values()) {
      const y = p.y + (p.held ? 0 : Math.sin(t / 900 + p.phase) * amp);
      p.el.style.transform = `translate3d(${p.x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    }
    if (tapbackFor) positionTapback();
  }

  function bindFloat(p) {
    p.el.addEventListener('pointerdown', e => {
      if (state.view !== 'collect' || e.button > 0) return;
      e.preventDefault();
      closeTapback();
      p.el.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, px = p.x, py = p.y;
      let dragging = false, lx = sx, ly = sy, lt = e.timeStamp, vx = 0, vy = 0;
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!dragging && Math.hypot(dx, dy) < 5) return;
        if (!dragging) { dragging = true; p.held = true; p.el.classList.add('is-held'); }
        p.x = px + dx; p.y = py + dy;
        clampToBounds(p);
        const span = Math.max(1, ev.timeStamp - lt) / 1000;
        vx = vx * 0.6 + ((ev.clientX - lx) / span) * 0.4;
        vy = vy * 0.6 + ((ev.clientY - ly) / span) * 0.4;
        lx = ev.clientX; ly = ev.clientY; lt = ev.timeStamp;
      };
      const end = ev => {
        p.el.removeEventListener('pointermove', move);
        p.el.removeEventListener('pointerup', end);
        p.el.removeEventListener('pointercancel', end);
        if (!dragging) { if (ev.type === 'pointerup') openTapback(p.id, p.el); return; }
        p.held = false;
        p.el.classList.remove('is-held');
        p.vx = calm() ? 0 : clamp(vx, -420, 420);
        p.vy = calm() ? 0 : clamp(vy, -420, 420);
      };
      p.el.addEventListener('pointermove', move);
      p.el.addEventListener('pointerup', end);
      p.el.addEventListener('pointercancel', end);
    });
    // Keyboard: Enter/Space opens the menu, Delete removes.
    p.el.addEventListener('click', e => { if (e.detail === 0) openTapback(p.id, p.el, true); });
    p.el.addEventListener('keydown', e => {
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeIdea(p.id); }
    });
  }

  function popAllBodies() {
    closeTapback();
    for (const p of [...bodies.values()]) popEl(p.el, () => bodies.delete(p.id));
  }

  function popEl(el, done) {
    if (done) done();
    el.classList.add('is-leaving');
    el.disabled = true;
    setTimeout(() => el.remove(), calm() ? 0 : 260);
  }

  // ---------- sort screen ----------
  function tileEl(idea) {
    return h('button', { type: 'button', class: 'tile' + (idea.keep ? '' : ' is-off'), 'data-id': idea.id, 'aria-label': `${idea.text}. 끌어서 기능이나 디자인 칸에 놓기` },
      h('span', { class: 'bubble' }, idea.text));
  }

  function renderSort() {
    const waiting = state.ideas.filter(i => !i.cat);
    els.tray.replaceChildren(...waiting.map(tileEl));
    els.tray.hidden = !waiting.length;
    for (const b of BINS) {
      const items = state.ideas.filter(i => i.cat === b.id);
      binEls[b.id].items.replaceChildren(...items.map(tileEl));
      binEls[b.id].count.textContent = items.length ? String(items.length) : '';
    }
    applyAges();
  }

  function tileRects() {
    const rects = new Map();
    for (const el of els.sort.querySelectorAll('.tile')) rects.set(el.dataset.id, el.getBoundingClientRect());
    return rects;
  }

  // Slide every tile from where it was to where it now sits.
  function flipTiles(before) {
    if (calm()) return;
    for (const el of els.sort.querySelectorAll('.tile')) {
      const a = before.get(el.dataset.id);
      if (!a) continue;
      const b = el.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], { duration: 420, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    }
  }

  function moveIdea(id, cat, fromRect) {
    const idea = findIdea(id);
    if (!idea || idea.cat === cat) return false;
    const before = tileRects();
    if (fromRect) before.set(String(id), fromRect);
    idea.cat = cat;
    renderSort();
    flipTiles(before);
    save();
    const bin = BINS.find(b => b.id === cat);
    announce(bin ? `‘${bin.name}’ 칸에 넣었어요.` : '분류 전으로 돌려놓았어요.');
    return true;
  }

  // Drag a tile onto 기능 or 디자인 (or back to the top). A tap without moving opens the menu.
  let drag = null;
  els.sort.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile || e.button > 0 || drag) return;
    e.preventDefault();
    closeTapback();
    drag = { id: Number(tile.dataset.id), tile, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, ghost: null, over: null, offX: 0, offY: 0 };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
  });

  function onDragMove(e) {
    const s = drag;
    if (!s || e.pointerId !== s.pid) return;
    s.x = e.clientX; s.y = e.clientY;
    if (!s.active) {
      if (Math.hypot(s.x - s.x0, s.y - s.y0) < 5) return;
      beginDrag(s);
    }
    moveGhost(s);
  }

  function beginDrag(s) {
    s.active = true;
    const r = s.tile.getBoundingClientRect();
    s.offX = s.x0 - r.left; s.offY = s.y0 - r.top;
    s.ghost = s.tile.cloneNode(true);
    s.ghost.classList.add('ghost');
    s.ghost.removeAttribute('data-id');
    s.ghost.style.width = r.width + 'px';
    document.body.append(s.ghost);
    s.tile.classList.add('is-dragging');
    requestAnimationFrame(autoScroll);
  }

  function moveGhost(s) {
    s.ghost.style.transform = `translate(${s.x - s.offX}px, ${s.y - s.offY}px) scale(1.05)`;
    const under = document.elementFromPoint(s.x, s.y);
    const target = under && under.closest ? under.closest('#sort [data-drop]') : null;
    if (target !== s.over) {
      if (s.over) s.over.classList.remove('is-over');
      s.over = target;
      if (target) target.classList.add('is-over');
    }
  }

  function autoScroll() {
    const s = drag;
    if (!s || !s.active) return;
    const r = els.sort.getBoundingClientRect(), edge = 56;
    const v = s.y < r.top + edge ? -Math.ceil((r.top + edge - s.y) / 5) : s.y > r.bottom - edge ? Math.ceil((s.y - (r.bottom - edge)) / 5) : 0;
    if (v) { els.sort.scrollTop += v; moveGhost(s); }
    requestAnimationFrame(autoScroll);
  }

  function onDragEnd(e) {
    const s = drag;
    if (!s || e.pointerId !== s.pid) return;
    drag = null;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragEnd);
    if (!s.active) {
      if (e.type === 'pointerup') openTapback(s.id, s.tile);
      return;
    }
    if (s.over) s.over.classList.remove('is-over');
    const ghostRect = s.ghost.getBoundingClientRect();
    s.ghost.remove();
    s.tile.classList.remove('is-dragging');
    const cat = s.over ? s.over.dataset.drop || null : undefined;
    if (e.type === 'pointerup' && cat !== undefined && moveIdea(s.id, cat, ghostRect)) return;
    // Dropped outside a box or on its own box: glide back.
    flipTiles(new Map([[String(s.id), ghostRect]]));
  }

  els.sort.addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if (tile && e.detail === 0) openTapback(Number(tile.dataset.id), tile, true);
  });
  els.sort.addEventListener('keydown', e => {
    const tile = e.target.closest('.tile');
    if (tile && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); removeIdea(Number(tile.dataset.id)); }
  });
  els.sort.addEventListener('scroll', () => closeTapback(), { passive: true });
  els.sort.addEventListener('contextmenu', e => { if (e.target.closest('.tile')) e.preventDefault(); });

  // ---------- tapback menu (both screens) ----------
  let tapbackFor = null, tapSize = { w: 0, h: 0 };

  function openTapback(id, el, focus = false) {
    const idea = findIdea(id);
    if (!idea) return;
    closeTapback();
    const items = [];
    if (state.view === 'sort') for (const b of BINS) if (idea.cat !== b.id) items.push([`move:${b.id}`, `${b.name}으로`]);
    items.push(['toggle', idea.keep ? '빼기' : '다시 넣기']);
    if (state.view === 'collect') items.push(['edit', '수정']);
    items.push(['delete', '삭제']);
    els.tapback.replaceChildren(...items.map(([act, label]) =>
      h('button', { type: 'button', role: 'menuitem', 'data-act': act, class: act === 'delete' ? 'danger' : null }, label)));
    tapbackFor = { id, el };
    const p = bodies.get(id);
    if (state.view === 'collect' && p) p.held = true;
    el.classList.add('is-selected');
    els.tapback.hidden = false;
    tapSize = { w: els.tapback.offsetWidth, h: els.tapback.offsetHeight };
    positionTapback();
    if (focus) els.tapback.querySelector('button').focus({ preventScroll: true });
  }

  function positionTapback() {
    const card = els.card.getBoundingClientRect();
    const r = tapbackFor.el.getBoundingClientRect();
    let x = r.left - card.left + r.width / 2 - tapSize.w / 2;
    let y = r.top - card.top - tapSize.h - 8;
    if (y < 6) y = r.bottom - card.top + 8;
    x = clamp(x, 6, Math.max(6, card.width - tapSize.w - 6));
    els.tapback.style.transform = `translate(${x}px, ${y}px)`;
  }

  function closeTapback() {
    if (!tapbackFor) return;
    const p = bodies.get(tapbackFor.id);
    if (p) p.held = false;
    tapbackFor.el.classList.remove('is-selected');
    tapbackFor = null;
    els.tapback.hidden = true;
  }

  els.tapback.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || !tapbackFor) return;
    const { id, el } = tapbackFor;
    const idea = findIdea(id);
    const act = btn.dataset.act;
    closeTapback();
    if (!idea) return;
    if (act.startsWith('move:')) {
      moveIdea(id, act.slice(5), el.getBoundingClientRect());
    } else if (act === 'toggle') {
      idea.keep = !idea.keep;
      paintKeep();
      el.classList.toggle('is-off', !idea.keep);
      save();
      announce(idea.keep ? '다시 넣었어요.' : '빼 두었어요.');
    } else if (act === 'delete') {
      removeIdea(id);
      announce('지웠어요.');
    } else if (act === 'edit') {
      removeIdea(id);
      els.ideaInput.value = idea.text;
      els.sendBtn.disabled = false;
      els.ideaInput.focus();
      els.ideaInput.select();
    }
  });
  document.addEventListener('pointerdown', e => {
    if (tapbackFor && !e.target.closest('#tapback') && !e.target.closest('.float, .tile')) closeTapback();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTapback(); });

  // ---------- ideas ----------
  function addIdea(raw) {
    const text = raw.replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!text) return;
    const idea = { id: state.nextId++, text, keep: true, cat: null };
    state.ideas.push(idea);
    if (state.view === 'collect') {
      syncBodies(idea.id);
    } else {
      const before = tileRects();
      renderSort();
      flipTiles(before);
      const tile = els.tray.querySelector(`.tile[data-id="${idea.id}"]`);
      if (tile) markNew(tile);
      els.sort.scrollTo({ top: 0, behavior: calm() ? 'auto' : 'smooth' });
    }
    renderChrome();
    save();
  }

  function removeIdea(id) {
    if (tapbackFor && tapbackFor.id === id) closeTapback();
    state.ideas = state.ideas.filter(i => i.id !== id);
    const p = bodies.get(id);
    if (p) popEl(p.el, () => bodies.delete(id));
    if (state.view === 'collect') {
      applyAges();
      fitScale();
    } else {
      const tile = els.sort.querySelector(`.tile[data-id="${id}"]`);
      const finish = () => { const before = tileRects(); renderSort(); flipTiles(before); };
      if (tile && !calm()) { tile.classList.add('is-leaving'); setTimeout(finish, 240); } else finish();
    }
    renderChrome();
    save();
  }

  // ---------- input ----------
  function send() {
    const v = els.ideaInput.value;
    if (!v.trim()) return;
    addIdea(v);
    els.ideaInput.value = '';
    els.sendBtn.disabled = true;
    els.ideaInput.focus();
  }

  els.ideaInput.addEventListener('input', () => { els.sendBtn.disabled = !els.ideaInput.value.trim(); });
  els.ideaInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    send();
  });
  // Pasting a list adds one bubble per line.
  els.ideaInput.addEventListener('paste', e => {
    const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
    if (!/\n/.test(text.trim())) return;
    e.preventDefault();
    text.split(/\r?\n/)
      .map(l => l.replace(/^\s*(?:[-*•·]|\d+[.)])\s*/, ''))
      .filter(l => l.trim())
      .forEach((l, i) => setTimeout(() => addIdea(l), calm() ? 0 : i * 90));
  });
  els.sendBtn.addEventListener('pointerdown', e => e.preventDefault()); // keep the keyboard open on phones
  els.sendBtn.addEventListener('click', send);

  els.topic.addEventListener('input', () => {
    state.topic = els.topic.value;
    renderChrome();
    save();
  });
  els.topic.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); els.ideaInput.focus(); }
  });

  els.navLeft.addEventListener('click', onNav);
  els.navRight.addEventListener('click', onNav);

  let resizeFrame = 0;
  function relayout() {
    if (els.stage.hidden) return;
    refreshBounds();
    fitScale();
    for (const p of bodies.values()) clampToBounds(p);
  }
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(relayout);
  }).observe(els.stage);

  // ---------- boot ----------
  load();
  els.topic.value = state.topic;
  els.stage.hidden = state.view !== 'collect';
  els.sort.hidden = state.view !== 'sort';
  if (state.view === 'collect') {
    refreshBounds();
    syncBodies();
    renderBodies(performance.now());
  } else {
    renderSort();
  }
  renderChrome();
  lastT = performance.now();
  requestAnimationFrame(tick);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
})();
</script>
